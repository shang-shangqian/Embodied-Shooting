[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-shooting-lk-ostrack"
version = "0.1.0"
description = "Selected original LK/OSTrack, turret decision and velocity source modules"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = ["numpy==1.26.4", "opencv-python-headless==4.10.0.84", "Pillow>=10,<12"]

[project.optional-dependencies]
velocity = ["torch>=2.2,<2.8"]
decision = ["rl-games==1.6.1", "imageio>=2.31,<3", "imageio-ffmpeg>=0.4,<0.7"]
ostrack = ["torch>=2.2,<2.8", "torchvision>=0.17,<0.23", "timm==1.0.27", "easydict==1.13", "PyYAML>=6,<7"]
dev = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
where = ["source/standalone"]
namespaces = true
include = ["test_lk_ostrack", "test7_2_weight", "test11", "test11.speed_prediction", "test11.speed_prediction.common", "test11.speed_prediction.legacy_gru", "test11.speed_prediction.taq_gru", "test11.speed_prediction.data_tools"]

[tool.setuptools.package-data]
test7_2_weight = ["*.usd", "*.urdf", "*.md", "lite3/**/*.usd", "turret/**/*.usd"]
test11 = ["*.usd", "*.urdf", "*.md", "lite3/**/*.usd", "turret/**/*.usd"]
test_lk_ostrack = ["*.usd", "*.urdf", "*.md", "lite3/**/*.usd", "turret/**/*.usd", "ostrack/OSTrack-main/LICENSE", "ostrack/OSTrack-main/README.md", "ostrack/OSTrack-main/lib/**/*.py", "ostrack/OSTrack-main/experiments/ostrack/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["source/standalone/test_lk_ostrack/tests"]
